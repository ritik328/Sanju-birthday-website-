<style>

.bl{position:absolute;bottom:-70px;border:0;background:none;cursor:pointer;padding:0}

.fly{position:absolute;bottom:0;z-index:1}
.bqw{position:relative;width:min(300px,70vw);margin:auto}.bqw .bq{width:100%}.bf{position:absolute}
.ff{position:absolute;width:6px;height:10px;border-radius:50%;background:#3a2a1a;opacity:0;transition:opacity 1s}
.ff::after{content:'';position:absolute;bottom:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:#fff3a0;box-shadow:0 0 10px 5px #ffe45c,0 0 24px 10px #ffe45c88;animation:gl 1.6s infinite alternate}
body.n .bqw .ff,.ff.on{opacity:1}
@keyframes gl{to{opacity:.35}}
.bf svg{animation:fl .22s infinite alternate}@keyframes fl{to{transform:scaleX(.35)}}
.veil{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:.92}
#cf,#ff{position:fixed;inset:0;pointer-events:none;z-index:90}#ff{z-index:2}
.ed input[type=text]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--pk)}.ed label{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}.row{display:flex;gap:8px;justify-content:center}
.fr{cursor:pointer;position:relative}
.fr-rot{position:absolute;top:6px;right:6px;z-index:20;border:0;border-radius:12px;padding:4px 9px;font-family:inherit;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.95);color:#5a1630;box-shadow:0 2px 8px rgba(0,0,0,.28);cursor:pointer;transition:transform .2s,background .2s}
.fr-rot:hover{transform:scale(1.08);background:#fff}
.empty-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;font-size:.85rem;color:var(--pk);opacity:.9;padding:12px;cursor:pointer;text-align:center}
.empty-placeholder:hover{opacity:1;transform:scale(1.05)}
#eb{position:fixed;left:12px;bottom:12px;z-index:100;font-family:inherit;font-size:1rem;display:flex;gap:10px;align-items:center;background:var(--card);padding:8px 14px;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.25);border:2px solid var(--pk)}

:focus-visible{outline:3px solid var(--pk);outline-offset:3px}
</style></head><body>

<script>
const NAME='Sanju',RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let EDIT=localStorage.getItem('editMode')!==null?localStorage.getItem('editMode')==='1':(!/[?&]view=1/.test(location.search));

const L2=['Again,','A very happy birthday Sanjana, may God bless you, sending you all love and good wishes from my side. May universe give you the best everyday and bring laughter and joy to you, and wishing you great success for future. May you get all love that you deserve and be happy in all your coming birthdays 💖🫶','🎂💖🫶🤗'];
const QZ=[[{q:'Where did we first meet?',o:['India Gate','Sunder Nursery','Garden of Sense'],a:0},{q:'Edit me: my favourite thing about you?',o:['Your smile','Your laugh','Everything'],a:2}]];
const $=(s,e=document)=>e.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.innerHTML=x;return e};
const COL=['#ff5c8a','#ffd95e','#7fd8ff','#c77dff','#ff9db8','#9bf0a8'];
const toast=t=>{const e=h('div','',t);e.id='ts';document.body.append(e);setTimeout(()=>e.remove(),3500)};
$('#h1').textContent='Happy Birthday, '+NAME;$('#h2f').textContent='Happy Birthday, '+NAME;
$('#kd').innerHTML='<svg width="20" height="15" viewBox="0 0 40 30"><g fill="#ff5c8a"><path d="M20 15C14-2 2 0 4 12 6 22 16 22 20 15Z"/><path d="M20 15C26-2 38 0 36 12 34 22 24 22 20 15Z"/></g></svg>';
if(!RM&&window.Lenis){const l=new Lenis();l.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>l.raf(t*1000));gsap.ticker.lagSmoothing(0)}
gsap.registerPlugin(ScrollTrigger);
/* confetti */
const cc=$('#cf'),cx=cc.getContext('2d');let P=[],on=0;
const rs=()=>{cc.width=$('#ff').width=innerWidth;cc.height=$('#ff').height=innerHeight};rs();addEventListener('resize',rs);
function confetti(x,y,n,a0){
  for(let i=0;i<n;i++){
    const a=(a0??-1.57)+(Math.random()-.5)*1.2,v=6+Math.random()*12;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,w:6+Math.random()*6,c:COL[i%6],l:110+Math.random()*60});

    if(P.length){
      requestAnimationFrame(f);
    }else{
      on=0;
      cx.clearRect(0,0,cc.width,cc.height);

  }

}
/* fireflies (night) */
const fx=$('#ff').getContext('2d'),F=Array.from({length:34},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,p:Math.random()*9,s:.2+Math.random()*.4}));
(function lp(){requestAnimationFrame(lp);fx.clearRect(0,0,innerWidth,innerHeight);if(!document.body.classList.contains('n'))return;F.forEach(f=>{if(!RM){f.p+=.02;f.x+=Math.sin(f.p)*f.s;f.y+=Math.cos(f.p*.7)*f.s}const a=.35+.65*Math.abs(Math.sin(f.p*1.3)),g=fx.createRadialGradient(f.x,f.y+4,0,f.x,f.y+4,18);g.addColorStop(0,'rgba(255,240,120,'+a+')');g.addColorStop(1,'rgba(255,240,120,0)');fx.fillStyle=g;fx.fillRect(f.x-18,f.y-14,36,36);fx.fillStyle='#2a1c10';fx.fillRect(f.x-1.5,f.y-5,3,6)})})();
/* theme toggle */
const tg=$('#tg'),setN=n=>{document.body.classList.toggle('n',n);tg.setAttribute('aria-pressed',n);try{localStorage.n=n?1:''}catch{}};

/* art */
const BL=c=>`<svg viewBox="0 0 40 62" width="48"><ellipse cx="20" cy="20" rx="16" ry="19" fill="${c}"/><path d="M20 39l-4 6h8z" fill="${c}"/><path d="M20 45q-6 8 0 16" stroke="#888" fill="none"/><ellipse cx="13" cy="13" rx="4" ry="6" fill="#fff" opacity=".4"/></svg>`;
const BF=c=>`<div class="bf"><svg viewBox="0 0 40 30" width="30"><g fill="${c}"><path d="M20 15C14-2 2 0 4 12 6 22 16 22 20 15Z"/><path d="M20 15C26-2 38 0 36 12 34 22 24 22 20 15Z"/></g><rect x="19" y="8" width="2" height="14" rx="1" fill="#5a1630"/></svg></div>`;
const FL={rose:'<circle r="24" fill="#ff4d7d"/><circle r="17" fill="#ff7aa0"/><path d="M0-8a8 8 0 1 1-8 8a13 13 0 1 1 16-12" fill="none" stroke="#c2185b" stroke-width="2.5"/>',

/* frames */
let S={f:{},g:{}},U={},T0;
const DB=new Promise(r=>{try{const q=indexedDB.open('bday',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const idb=(m,k,v)=>DB.then(d=>d?new Promise((r,j)=>{const t=d.transaction('m',m==='get'?'readonly':'readwrite').objectStore('m'),q=m==='get'?t.get(k):m==='put'?t.put(v,k):t.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}):Promise.reject('no db'));
const save=()=>idb('put','state',S).catch(()=>toast('Could not save in this browser. Export soon so nothing is lost.'));
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?x.target.play().catch(()=>{}):x.target.pause()),{threshold:.4});
function tr(e){const d=S.f[e.dataset.id],x=$('.m img,.m video',e);if(d&&x)x.style.transform=`translate(${d.x||0}%,${d.y||0}%) scale(${(d.z||1)*(d.sx||1)},${(d.z||1)*(d.sy||1)})`}
function paint(e){const id=e.dataset.id,d=S.f[id],m=$('.m',e);e.dataset.o=d?.o||'p';$('.tg',e).textContent=d?.tag||'';m.innerHTML='';
if(!d||!d.file){m.innerHTML=EDIT?'<div class="empty-placeholder"><span style="font-size:1.8rem;display:block">📷</span><span>Click to add photo/video</span></div>':'<span class="em">♡</span>'}
else{const v=d.type==='video',x=document.createElement(v?'video':'img');x.src=U[id]||d.file;x.alt=d.tag||'';
if(v){x.muted=x.loop=x.playsInline=true;x.preload='metadata';x.onloadedmetadata=()=>{if(d.a)x.currentTime=d.a};x.ontimeupdate=()=>{if(d.b&&x.currentTime>=d.b)x.currentTime=d.a||0};io.observe(x)}
x.onerror=()=>{m.innerHTML='<span class="em">Media missing</span>'};m.append(x);tr(e)}
const oldB=$('.fr-rot',e);if(oldB)oldB.remove();
if(EDIT){const rb=h('button','fr-rot',d?.o==='l'?'↕ Tall':'↔ Wide');rb.title='Toggle orientation';rb.onclick=ev=>{ev.stopPropagation();const item=S.f[id]=S.f[id]||{type:'image'};item.o=item.o==='l'?'p':'l';paint(e);save()};e.append(rb)}}
function frame(g,i){const e=h('div','fr','<div class="m"></div><div class="tg"></div>');e.dataset.id=g+i;paint(e);return e}
function build(){document.querySelectorAll('.grp').forEach(c=>{const g=c.dataset.g,n=S.g[g]||+c.dataset.n;c.innerHTML='';for(let i=0;i<n;i++)c.append(frame(g,i));
if(EDIT){const b=h('button','add','+ Add frame');b.onclick=()=>{S.g[g]=(S.g[g]||+c.dataset.n)+1;c.insertBefore(frame(g,S.g[g]-1),b);save()};c.append(b)}});
if(!RM){gsap.to('.wall .fr',{rotation:i=>i%2?2.5:-2.5,yoyo:true,repeat:-1,duration:3,ease:'sine.inOut',stagger:.25});gsap.set('.pol .fr',{rotation:()=>Math.random()*14-7})}
ScrollTrigger.refresh()}
async function load(){try{if(EDIT){const s=await idb('get','state');if(s)S=s;for(const id in S.f)if(S.f[id].local){const b=await idb('get','b:'+id);if(b)U[id]=URL.createObjectURL(b)}}}catch{}
if(!Object.keys(S.f).length)try{const r=await fetch('data.json',{cache:'no-cache'});if(r.ok)S=await r.json()}catch{}
build();updateEditBar()}
document.addEventListener('click',ev=>{const e=ev.target.closest('.fr');if(!e||ev.target.closest('.fr-rot'))return;if(!EDIT){const v=$('video',e);if(v)v.muted=!v.muted;return}edit(e)});
const SL=[['z','Zoom (crop)',1,3,.05,1],['x','Move left / right',-50,50,1,0],['y','Move up / down',-50,50,1,0],['sx','Stretch width',.5,2,.05,1],['sy','Stretch height',.5,2,.05,1],['a','Video trim start (s)',0,300,.1,0],['b','Video trim end (s, 0 = full)',0,300,.1,0]];
function edit(e){const id=e.dataset.id,old=JSON.stringify(S.f[id]||null),oldU=U[id],d=S.f[id]=S.f[id]||{type:'image'};let file=null;
const o=h('div','pop ed');o.innerHTML='<div class="pc" data-lenis-prevent><h2>Edit frame ('+id+')</h2><input type="file" id="fi" accept="image/*,video/*"><input type="text" id="ft" placeholder="Tag or caption" maxlength="40" value="'+(d.tag||'').replace(/"/g,'&quot;')+'"><div style="display:flex;gap:8px;justify-content:center"><button type="button" id="or" class="bt" style="padding:6px 14px;font-size:.9rem">Orientation: '+(d.o==='l'?'Landscape ↔':'Portrait ↕')+'</button></div>'+SL.map(s=>`<label>${s[1]}<input type="range" data-k="${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${d[s[0]]??s[5]}"></label>`).join('')+'<div class="row"><button id="sv">Save</button><button id="cl">Cancel</button><button id="rm">Remove</button></div><p class="sm" id="er"></p></div>';document.body.append(o);
const close=()=>o.remove(),er=t=>$('#er',o).textContent=t;
$('#or',o).onclick=()=>{d.o=d.o==='l'?'p':'l';$('#or',o).textContent='Orientation: '+(d.o==='l'?'Landscape ↔':'Portrait ↕');paint(e)};
$('#fi',o).onchange=ev=>{file=ev.target.files[0];if(!file)return;if(file.size>40e6)er('Large file. Compress it for faster loading on her phone.');const ext=(file.name.split('.').pop()||'bin').toLowerCase();d.type=file.type.startsWith('video')?'video':'image';d.file='media/'+id+'.'+ext;d.local=1;U[id]=URL.createObjectURL(file);paint(e)};
o.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{d[r.dataset.k]=+r.value;tr(e);const v=$('video',e);if(v&&r.dataset.k==='a')v.currentTime=+r.value});
$('#ft',o).oninput=ev=>{d.tag=ev.target.value;$('.tg',e).textContent=d.tag};
$('#sv',o).onclick=async()=>{try{if(file)await idb('put','b:'+id,file)}catch{return er('Could not store this file in the browser. Try a smaller file.')}await save();close()};
$('#cl',o).onclick=()=>{if(old==='null')delete S.f[id];else S.f[id]=JSON.parse(old);U[id]=oldU;paint(e);close()};
$('#rm',o).onclick=async()=>{delete S.f[id];delete U[id];try{await idb('del','b:'+id)}catch{}paint(e);save();close()}}
async function exp(){const b=$('#ex');b.textContent='Preparing zip…';try{await new Promise((r,j)=>{const s=h('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=r;s.onerror=j;document.head.append(s)});const z=new JSZip(),O={};for(const id in S.f){const d=S.f[id];O[id]={...d};delete O[id].local;if(d.local){const bl=await idb('get','b:'+id);if(bl)z.file(d.file,bl)}}z.file('data.json',JSON.stringify({f:O,g:S.g},null,1));const bl=await z.generateAsync({type:'blob',compression:'STORE'}),a=h('a');a.href=URL.createObjectURL(bl);a.download='birthday-media.zip';a.click()}catch{toast('Export failed. Check your connection and try again.')}b.textContent='Export for Vercel'}
